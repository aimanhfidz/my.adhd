<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- focus.myadhd.my's icon. The my.adhd mark as a stopwatch: the seven
       orange arms sit inside a violet case, and the detached eighth arm —
       the capsule — has become the crown. Same colours as /favicon.svg,
       so the two read as family; violet-led where that one is orange-led,
       so they are easy to tell apart in a row of tabs. -->
  <rect width="512" height="512" rx="96" fill="#2A2D33"/>
  <circle cx="256" cy="284" r="168" fill="none" stroke="#7B3FE4" stroke-width="34"/>
  <path d="M222 70h68" stroke="#7B3FE4" stroke-width="42" stroke-linecap="round"/>
  <rect x="244" y="84" width="24" height="36" fill="#7B3FE4"/>
  <g transform="translate(131 159) scale(2.5)">
    <g fill="#F75C03">
      <rect x="46.5" y="18" width="7" height="64"/>
      <rect x="46.5" y="18" width="7" height="64" transform="rotate(90 50 50)"/>
      <rect x="46.5" y="18" width="7" height="64" transform="rotate(45 50 50)"/>
      <rect x="46.5" y="18" width="7" height="32" transform="rotate(-45 50 50)"/>
    </g>
  </g>
</svg>
