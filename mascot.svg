<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 262" role="img" aria-label="my.adhd mascot">
  <style>
    .mx-ink{stroke:#101018;stroke-width:3.2;fill:none;stroke-linejoin:round}
    .mx-cap{stroke-linecap:round;stroke-linejoin:round}
    .mx-skin{fill:#F2B477}.mx-hair{fill:#101018}.mx-tee{fill:#202030}
    .mx-eye{fill:#101018}.mx-lens{fill:#fff;fill-opacity:.13}
    .mx-curls{stroke:none}
    .mx-strand{stroke:#2E2E42;opacity:.85;stroke-width:2;fill:none;stroke-linecap:round}
    .mx-tee-line{stroke:#101018;stroke-width:2.4;fill:none;stroke-linecap:round;opacity:.5}
    .mx-blush path{stroke:#F75C03;stroke-width:3.4;stroke-linecap:round;fill:none;opacity:.85}
  </style>
  <defs>
  <filter id="mx-rough" x="-12%" y="-12%" width="124%" height="124%">
      <feTurbulence type="fractalNoise" baseFrequency="0.045" numOctaves="3" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="mx-grain" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="3" result="g"/>
      <feColorMatrix in="g" type="saturate" values="0"/>
      <feComponentTransfer result="gg"><feFuncA type="linear" slope=".16"/></feComponentTransfer>
      <feBlend in="SourceGraphic" in2="gg" mode="multiply"/>
    </filter>
  <g id="mx-head">
      <!-- ears: small, level with the eyes, tucked against the skull -->
      <ellipse cx="74" cy="114" rx="11" ry="14" class="mx-ink mx-skin"/>
      <ellipse cx="166" cy="114" rx="11" ry="14" class="mx-ink mx-skin"/>
      <path d="M76 108c-4 3-5 9-3 13" class="mx-ink mx-cap" stroke-width="2.2"/>
      <path d="M164 108c4 3 5 9 3 13" class="mx-ink mx-cap" stroke-width="2.2"/>

      <!-- face: rounded, jaw a little wider than before -->
      <path d="M120 48c27 0 48 19 48 47 0 33-21 57-48 57s-48-24-48-57c0-28 21-47 48-47z" class="mx-ink mx-skin"/>

      <!-- hair: scalloped mass, fringe held above the brow line -->
      <path class="mx-hair" d="M70 112c-10-12-12-26-4-36-10-12-4-30 10-34-2-14 14-22 28-16 10-12 26-10 34 2 16-2 28 12 26 26 12 8 14 26 6 34 4 10 0 20-6 24-2-12-6-20-14-26-10 6-22 6-30 0-10-8-22-6-30 2-10-4-18 2-22 12-2 6-4 10-4 12z"/>
      <g class="mx-hair mx-curls">
        <circle cx="80" cy="52" r="11.5"/><circle cx="71" cy="74" r="10"/>
        <circle cx="99" cy="32" r="12.5"/><circle cx="124" cy="24" r="13"/>
        <circle cx="148" cy="30" r="12.5"/><circle cx="166" cy="48" r="11.5"/>
        <circle cx="176" cy="70" r="10"/>
      </g>
      <path class="mx-strand" d="M116 36c-14 8-24 21-27 37M126 36c9 9 14 21 15 34"/>

      <!-- glasses -->
      <circle cx="99" cy="112" r="20" class="mx-ink mx-lens"/>
      <circle cx="141" cy="112" r="20" class="mx-ink mx-lens"/>
      <path d="M119 110c1-2 4-2 5 0" class="mx-ink mx-cap"/>
      <path d="M79 111c-5-1-9 0-11 2M161 111c5-1 9 0 11 2" class="mx-ink mx-cap"/>
      <circle cx="99" cy="112" r="7.5" class="mx-eye"/>
      <circle cx="141" cy="112" r="7.5" class="mx-eye"/>

      <!-- nose + a small closed smile -->
      <path d="M120 118c-3 7-5 11-1 13" class="mx-ink mx-cap"/>
      <path d="M110 138c6 6 14 6 20 0" class="mx-ink mx-cap"/>

      <!-- blush: two short marks per cheek, clear of the mouth -->
      <g class="mx-blush">
        <path d="M85 140l10-3M87 147l10-3"/>
        <path d="M155 140l-10-3M153 147l-10-3"/>
      </g>
    </g>
  </defs>
  <path fill="#3A3568" filter="url(#mx-rough)"
      d="M62 18C104 10 150 8 190 20c14 5 16 22 17 42 3 44 4 118-2 160-2 16-10 26-26 28-44 6-98 6-142-1-14-2-22-12-23-28-4-42-3-114 0-158 1-22 5-40 18-45z"/>
  <g fill="#524D80">
    <path d="M46 62l3.6 8 8 3.6-8 3.6-3.6 8-3.6-8-8-3.6 8-3.6z"/>
    <path d="M206 96l2.8 6.2 6.2 2.8-6.2 2.8-2.8 6.2-2.8-6.2-6.2-2.8 6.2-2.8z"/>
    <circle cx="212" cy="52" r="4.5"/><circle cx="34" cy="128" r="3.5"/>
  </g>
  <g id="mx-bust">
      <path d="M107 144h26v30c0 7-26 7-26 0z" class="mx-ink mx-skin"/>
      <path d="M133 170c25 6 42 17 48 33 4 11 6 25 6 41H53c0-16 2-30 6-41 6-16 23-27 48-33 3 9 23 9 26 0z" class="mx-ink mx-tee"/>
      <path d="M107 170c3 8 23 8 26 0" class="mx-tee-line"/>
      <path d="M67 211c-4 10-6 21-6 33M173 211c4 10 6 21 6 33" class="mx-tee-line"/>
      <use href="#mx-head"/>
    </g>
</svg>
