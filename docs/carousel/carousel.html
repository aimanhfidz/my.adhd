<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1080">
<meta name="robots" content="noindex">
<title>my.adhd carousel</title>
<link rel="stylesheet" href="carousel.css">
</head>
<body>
<!-- Everything is built by carousel.js from posts/<slug>.json.
     Open as carousel.html?post=example-en — add &render=1 to drop the
     preview gaps so a 1080×1350 viewport sees exactly one slide. -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <g id="logo-mark">
      <g class="lg-star">
        <rect x="46.5" y="18" width="7" height="64"/>
        <rect x="46.5" y="18" width="7" height="64" transform="rotate(90 50 50)"/>
        <rect x="46.5" y="18" width="7" height="64" transform="rotate(45 50 50)"/>
        <rect x="46.5" y="18" width="7" height="32" transform="rotate(-45 50 50)"/>
      </g>
      <path class="lg-pill" d="M64.5 64.5l7 7" stroke-width="7" stroke-linecap="round" fill="none"/>
    </g>
    <g id="i-heart"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21.2l7.8-7.8 1-1a5.5 5.5 0 0 0 0-7.8z"/></g>
    <g id="i-comment"><path d="M21 11.5a8.4 8.4 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.4 8.4 0 0 1-3.8-.9L3 21l1.9-5.7a8.4 8.4 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.4 8.4 0 0 1 3.8-.9h.5a8.5 8.5 0 0 1 8 8v.5z"/></g>
    <g id="i-send"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4z"/></g>
    <g id="i-save"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></g>
    <g id="i-arrow"><path d="M5 12h13M12 5l7 7-7 7"/></g>
  </defs>
</svg>
<main id="deck"></main>
<script src="carousel.js"></script>
</body>
</html>
